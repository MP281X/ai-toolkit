<!doctype html>
<html lang="en" style="color-scheme: dark; font-size: 14px; line-height: 1.5">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Plan</title>
		<style>
			:root {
				--background: oklch(0.18 0.006 285.885);
				--foreground: oklch(0.965 0.002 285.823);
				--card: oklch(0.22 0.007 285.885);
				--primary: oklch(0.7214 0.1337 49.9802);
				--primary-foreground: oklch(0.1797 0.0043 308.1928);
				--secondary: oklch(0.26 0.006 286.033);
				--muted: oklch(0.25 0.006 286.033);
				--muted-foreground: oklch(0.75 0.012 286.067);
				--accent: oklch(0.31 0.007 286.033);
				--border: oklch(1 0 0 / 12%);
				--destructive: oklch(0.704 0.191 22.216);
				--chart-1: oklch(0.837 0.128 66.29);
				--chart-2: oklch(0.7214 0.1337 49.9802);
				--chart-3: oklch(0.646 0.222 41.116);
				--chart-4: oklch(0.553 0.195 38.402);
				--chart-5: oklch(0.47 0.157 37.304);
				font-family:
					'JetBrainsMono Nerd Font Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
					'Liberation Mono', monospace;
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}
			html,
			body {
				min-height: 100%;
			}
			body {
				margin: 0;
				background: var(--background);
				color: var(--foreground);
				-webkit-font-smoothing: antialiased;
			}
			main {
				width: min(100% - 2rem, 72rem);
				margin-inline: auto;
				padding-block: 1rem 2rem;
			}
			h1,
			h2,
			h3,
			p {
				margin-block: 0;
			}
			h1 {
				font-size: clamp(1.5rem, 3vw, 2.25rem);
				line-height: 1.15;
			}
			h2 {
				font-size: 1.125rem;
			}
			a {
				color: var(--chart-1);
			}
			code,
			pre {
				font: inherit;
			}
			pre {
				overflow: auto;
				padding: 1rem;
				border: 1px solid var(--border);
				border-radius: 0.75rem;
				background: var(--muted);
			}
			svg {
				display: block;
			}

			.stack {
				display: grid;
				gap: 1rem;
			}
			.stack-sm {
				display: grid;
				gap: 0.5rem;
			}
			.cluster {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 0.5rem;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
				gap: 1rem;
			}
			.flow {
				display: grid;
				grid-auto-flow: column;
				grid-auto-columns: minmax(10rem, 1fr);
				align-items: center;
				gap: 2.25rem;
				overflow-x: auto;
				padding: 0.25rem;
			}
			.card,
			.node {
				padding: 1rem;
				border: 1px solid var(--border);
				border-radius: 0.75rem;
				background: var(--card);
			}
			.node {
				position: relative;
				min-width: 10rem;
			}
			.node + .node::before {
				position: absolute;
				right: calc(100% + 0.55rem);
				top: 50%;
				width: 1.1rem;
				border-top: 1px solid var(--primary);
				content: '';
			}
			.badge {
				display: inline-flex;
				align-items: center;
				gap: 0.35rem;
				width: fit-content;
				padding: 0.2rem 0.5rem;
				border-radius: 999px;
				background: var(--secondary);
				color: var(--muted-foreground);
				font-size: 0.75rem;
			}
			.badge-primary {
				background: var(--primary);
				color: var(--primary-foreground);
			}
			.muted {
				color: var(--muted-foreground);
			}
			.accent {
				color: var(--primary);
			}
			.danger {
				color: var(--destructive);
			}
			.icon {
				width: 1rem;
				height: 1rem;
				flex: none;
				stroke: currentColor;
				stroke-width: 2;
				fill: none;
				stroke-linecap: round;
				stroke-linejoin: round;
			}
			.icon-lg {
				width: 1.5rem;
				height: 1.5rem;
			}
			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				margin: -1px;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				border: 0;
			}

			@media (max-width: 40rem) {
				main {
					width: min(100% - 1rem, 72rem);
				}
				.flow {
					grid-auto-flow: row;
					grid-auto-columns: auto;
					overflow: visible;
				}
				.node + .node::before {
					right: auto;
					left: 1.5rem;
					top: auto;
					bottom: calc(100% + 0.55rem);
					width: 0;
					height: 1.1rem;
					border-top: 0;
					border-left: 1px solid var(--primary);
				}
			}
		</style>
	</head>
	<body>
		<svg class="sr-only" aria-hidden="true">
			<defs>
				<symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></symbol>
				<symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
				<symbol id="icon-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
				<symbol id="icon-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /></symbol>
				<symbol id="icon-box" viewBox="0 0 24 24"><path d="m4 7 8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10" /></symbol>
				<symbol id="icon-branch" viewBox="0 0 24 24">
					<circle cx="6" cy="5" r="2" />
					<circle cx="18" cy="7" r="2" />
					<circle cx="6" cy="19" r="2" />
					<path d="M6 7v10M8 9c5 0 3-2 8-2" />
				</symbol>
				<symbol id="icon-code" viewBox="0 0 24 24"><path d="m8 9-3 3 3 3M16 9l3 3-3 3M14 5l-4 14" /></symbol>
				<symbol id="icon-eye" viewBox="0 0 24 24">
					<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z" />
					<circle cx="12" cy="12" r="3" />
				</symbol>
				<symbol id="icon-info" viewBox="0 0 24 24">
					<circle cx="12" cy="12" r="9" />
					<path d="M12 11v5M12 8h.01" />
				</symbol>
				<symbol id="icon-warning" viewBox="0 0 24 24"><path d="M12 3 2 21h20ZM12 9v5M12 17h.01" /></symbol>
			</defs>
		</svg>
		<main><!-- COMPLETE_PLAN --></main>
	</body>
</html>
