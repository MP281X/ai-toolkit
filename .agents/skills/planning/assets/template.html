<!doctype html>
<html lang="en" style="color-scheme: dark; font-size: 14px">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Plan</title>
		<style>
			:root {
				font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				color: #f3f1ee;
				background: #19191b;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
			}
			main {
				width: min(100%, 72rem);
				margin: 0 auto;
				padding: 1rem;
			}
			section {
				margin-block: 1rem;
				padding: 1rem;
				border: 1px solid #3c3a39;
				background: #232326;
			}
			h1,
			h2,
			h3 {
				line-height: 1.15;
			}
			p,
			li {
				line-height: 1.55;
			}
			a {
				color: #e9a767;
			}
			.muted {
				color: #b8b2ac;
			}
			.accent {
				color: #e9a767;
			}
			@media (min-width: 48rem) {
				main {
					padding: 2rem;
				}
				section {
					padding: 1.5rem;
				}
			}
		</style>
	</head>
	<body>
		<main><!-- COMPLETE_PLAN --></main>
	</body>
</html>
