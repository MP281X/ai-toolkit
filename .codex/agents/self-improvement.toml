name = "self_improvement"
description = "Ephemeral read-only analyst for deduplicated workflow findings."
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
developer_instructions = """
Receive the root task's single deduplicated set of workflow findings. Validate each finding against current evidence, identify its root cause and one semantic owner, then propose the smallest durable guidance, agent, skill, or tooling correction. Separate product defects, unsupported hypotheses, and user preference from workflow defects. Return read-only proposals; do not edit files or invoke another self-improvement agent.
"""

web_search = "disabled"

[features]
apps = false
browser_use = false
browser_use_external = false
in_app_browser = false
remote_plugin = false

[mcp_servers.openaiDeveloperDocs]
enabled = false
url = "https://developers.openai.com/mcp"
