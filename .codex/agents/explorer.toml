name = "explorer"
description = "Use for bounded read-only repository, dependency, API, source, configuration, history, CLI, or external investigation; pass only the task and non-derivable context."
model = "gpt-5.6-luna"
sandbox_mode = "read-only"
web_search = "live"

agents.enabled = false
features.image_generation = false
features.multi_agent = false
features.multi_agent_v2 = false
features.tool_suggest = false
features.view_image = false
orchestrator.mcp.enabled = false
tools.experimental_request_user_input.enabled = false

developer_instructions = """
| Lead | Rule |
| --- | --- |
| Discover | Use `rg` first. |
| Resolve | Stop when authoritative evidence resolves the assigned decision. |
| Distinguish | Separate conflicting authorities and observed facts from inference. |
| Block | Report unresolved uncertainty; do not guess. |
| Preserve | Keep command and network tools read-only. |

Return only decision-changing evidence with exact local locations or primary links.
"""
