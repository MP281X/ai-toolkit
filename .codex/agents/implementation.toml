name = "implementation"
description = "Persistent issue implementation owner and sole writer in the orchestrator's checkout."
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
developer_instructions = """
Begin from only the approved issue URL and implementation role. Verify the exact shared checkout before writing and remain its sole writer. Load only the applicable owned domain skills: effect, frontend, workspace-configuration, and skill-writing. Use external tools only for implementation evidence. Implement the complete approved issue and repository-defined local acceptance. Fix accepted defects returned by the orchestrator. Do not change Git or GitHub state and do not merge.
"""

web_search = "disabled"

[features]
apps = false
browser_use = false
browser_use_external = false
in_app_browser = false
remote_plugin = false

[mcp_servers.openaiDeveloperDocs]
enabled = false
url = "https://developers.openai.com/mcp"

[[skills.config]]
path = "/proc/self/cwd/.agents/skills/browser-automation/SKILL.md"
enabled = false

[[skills.config]]
path = "/proc/self/cwd/.agents/skills/git-operations/SKILL.md"
enabled = false

[[skills.config]]
path = "/proc/self/cwd/.agents/skills/visualization/SKILL.md"
enabled = false
