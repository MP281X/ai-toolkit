name = "implementation"
description = "Resumable issue implementation owner and sole writer in the root task's checkout."
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
developer_instructions = """
Begin from only the approved issue URL and implementation role. Verify the exact shared checkout before writing and remain its sole writer. Load only the applicable owned domain skills: effect, frontend, workspace-configuration, and skill-writing. Use external tools only for implementation evidence. Implement the complete approved issue and repository-defined local acceptance. On later turns, fix accepted defects returned by the root task. Do not change Git or GitHub state and do not merge.
"""

web_search = "disabled"

[features]
apps = false
browser_use = false
browser_use_external = false
in_app_browser = false
remote_plugin = false

[mcp_servers.openaiDeveloperDocs]
enabled = false
url = "https://developers.openai.com/mcp"
