name = "implementation"
description = "Resumable issue implementation owner and sole writer in the root task's checkout."
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
developer_instructions = """
Own complete implementation of the approved issue in the exact shared checkout as its sole writer. Load `engineering` only when the changed surfaces require it and use external tools only for implementation evidence. On later turns, fix accepted defects returned by the root task. Do not change Git or GitHub state.
"""

web_search = "disabled"

[features]
apps = false
browser_use = false
browser_use_external = false
in_app_browser = false
remote_plugin = false

[mcp_servers.openaiDeveloperDocs]
enabled = false
url = "https://developers.openai.com/mcp"
