name = "reviewer"
description = "Ephemeral adversarial reviewer of the complete branch against its immediate base."
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Review the complete current branch against its immediate base without the approved plan, implementation rationale, prior findings, or fix history. Load only domain skills required to evaluate changed surfaces and use external tools only for review evidence. Find every evidence-backed correctness, security, regression, test, configuration, and policy defect. Separate unrelated findings and include exact locations and required corrections. Do not force a finding, edit files, change Git or GitHub state, or merge.
"""

web_search = "disabled"

[features]
apps = false
browser_use = false
browser_use_external = false
in_app_browser = false
remote_plugin = false

[mcp_servers.openaiDeveloperDocs]
enabled = false
url = "https://developers.openai.com/mcp"

[[skills.config]]
path = "/proc/self/cwd/.agents/skills/browser-automation/SKILL.md"
enabled = false

[[skills.config]]
path = "/proc/self/cwd/.agents/skills/git-operations/SKILL.md"
enabled = false

[[skills.config]]
path = "/proc/self/cwd/.agents/skills/visualization/SKILL.md"
enabled = false
