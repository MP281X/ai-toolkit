packages:
  - apps/*
  - packages/*

allowBuilds:
  msw: true
  protobufjs: true
  '@google/genai': true
  msgpackr-extract: true

onlyBuiltDependencies:
  - msw
  - protobufjs
  - '@google/genai'
  - msgpackr-extract

catalogMode: prefer

catalog:
  vite-plus: latest
  vite: npm:@voidzero-dev/vite-plus-core@latest
overrides:
  vite: 'catalog:'
  '@aws-sdk/client-bedrock-runtime>@aws-sdk/token-providers': 3.1079.0
  '@aws-sdk/credential-provider-sso>@aws-sdk/token-providers': 3.1079.0
peerDependencyRules:
  allowAny: [vite, typescript]
  allowedVersions: {vite: '*', typescript: '*'}
