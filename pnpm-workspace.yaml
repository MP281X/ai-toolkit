packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  '@google/genai': false
  msgpackr-extract: true
  protobufjs: false

catalogMode: prefer

catalog:
  vite-plus: latest
  vite: npm:@voidzero-dev/vite-plus-core@latest
overrides:
  effect: 4.0.0-rc.111
  vite: 'catalog:'
peerDependencyRules:
  allowAny: [vite, typescript]
  allowedVersions: {vite: '*', typescript: '*'}
minimumReleaseAgeExclude:
  - '@effect/atom-react@4.0.0-rc.108'
  - '@effect/opentelemetry@4.0.0-rc.108'
  - '@effect/platform-node-shared@4.0.0-rc.108'
  - '@effect/platform-node@4.0.0-rc.108'
  - '@effect/vitest@4.0.0-rc.108'
  - effect@4.0.0-rc.108
