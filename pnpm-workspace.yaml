packages:
  - apps/*
  - packages/*
  - .opencode

allowBuilds:
  msw: true
  msgpackr-extract: true

catalogMode: prefer

catalog:
  typescript: ^5
  '@types/node': ^24
  vite-plus: latest
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
overrides: {vite: 'catalog:', vitest: 'catalog:'}
peerDependencyRules:
  allowAny: [vite, vitest]
  allowedVersions: {vite: '*', vitest: '*'}
