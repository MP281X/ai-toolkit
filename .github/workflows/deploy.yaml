name: Build and Deploy

on: [push]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Docker Login
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Vite+
        uses: voidzero-dev/setup-vp@v1
        with: {node-version: '26', cache: true, run-install: true}

      - name: Check
        run: vp run check

      - name: Build
        if: github.ref == 'refs/heads/main'
        run: vp run build

      - name: Docker
        if: github.ref == 'refs/heads/main'
        run: |
          image_prefix=$(echo "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          for app in portfolio; do
            docker build ./apps/$app --tag $image_prefix-$app:latest
            docker push $image_prefix-$app:latest
          done

      - name: Dokploy
        if: github.ref == 'refs/heads/main'
        run: |
          for application_id in iD8YNp8nSkHVIdmp6kmB0; do
            curl -X POST https://dev.mp281x.xyz/api/application.deploy \
              -H "Content-Type: application/json" \
              -H "x-api-key: ${{ secrets.DOKPLOY_AUTH_TOKEN }}" \
              -d "{\"applicationId\": \"$application_id\"}"
          done
