- Exercise each affected interaction through its terminal visible result at the required viewport. Refresh snapshots after navigation or DOM changes; inspect console errors. Assert state rather than waiting an arbitrary duration.
- Use agent-browser only. Do not use native T3 browser or Codex computer use. Do not change product code, run project checks, or delegate further.
- Close the session and remove task artifacts except evidence needed to establish a defect.
- Return one concise acceptance result or a flat list of defects with criterion, observed impact, and retained evidence. Identify unavailable browser/runtime access as an unverified criterion, not a pass.

Complete when every assigned criterion has a result and the browser session is closed.
